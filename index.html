<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk AIP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      border-radius: 15px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .merek {
      display: block;
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      text-decoration: none;
      color: #222;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    .merek h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .merek p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Katalog Produk AIP</h1>
      <p>Katalog produk dan informasi produk</p>
    </div>

    <a class="merek" href="bunda-biru/">
      <h2>Bunda Biru</h2>
      <p>Lihat produk Bunda Biru</p>
    </a>

    <a class="merek" href="ibunda-yohanna/">
      <h2>Ibunda Yohanna</h2>
      <p>Lihat produk Ibunda Yohanna</p>
    </a>

    <a class="merek" href="bunda-medica/">
      <h2>Bunda Medica</h2>
      <p>Lihat produk Bunda Medica</p>
    </a>

    <div class="footer">
      Katalog Produk AIP
    </div>

  </div>

</body>
</html>
